[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playground-lm"
version = "0.1.0"
description = "From-scratch GPT-2-scale language model by the AI Playground team"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
export = [
    "torch>=2.2",
    "safetensors>=0.4",
]
onnx = [
    "torch>=2.2",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

benchmarks = [
    "torch>=2.2",
    "numpy>=1.26",
    "datasets>=3,<5",
    "transformers>=4.45,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
