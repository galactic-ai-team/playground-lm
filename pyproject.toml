[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playground-lm"
version = "0.1.0"
description = "From-scratch GPT-2-scale language model by the AI Playground team"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
export = [
    "torch>=2.2",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
