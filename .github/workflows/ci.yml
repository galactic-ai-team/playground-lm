name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy tiktoken pytest safetensors matplotlib onnx onnxruntime onnxscript && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: python -m pytest -q tests data src/playground_lm/train scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test demo/test_*.mjs
